async function listRemote(){const r=await api('/contents');

async function getFile(n){const r=await api('/contents/'+n,{headers:RAW});if(!r.ok)throw await apiErr(r);return cleanFile(await decJ(await r.text()))}
function buildFile(key){const rec={},del={};COLS.forEach(c=>{rec[c]=S[c].filter(r=>fileOf(c,r)===key)});Object.keys(S.del).forEach(k=>{if(S.del[k].f===key)del[k]=S.del[k]});return{v:1,rec,del}}
const isEmpty=o=>!Object.keys(o.del).length&&COLS.every(c=>!o.rec[c].length);
function vset(o){const a=[];COLS.forEach(c=>(o.rec[c]||[]).forEach(r=>a.push(keyOf(c,r)+'@'+(r.u||0))));Object.keys(o.del||{}).forEach(k=>a.push('x'+k+'@'+o.del[k].t));return a.sort().join('|')}
function mergeInto(list){const M={};COLS.forEach(c=>{M[c]=new Map(S[c].map(r=>[keyOf(c,r),r]))});
 list.forEach(R=>{Object.keys(R.del||{}).forEach(k=>{const v=R.del[k],c=S.del[k];if(!c||c.t<v.t)S.del[k]=v});
  COLS.forEach(c=>(R.rec[c]||[]).forEach(r=>{const k=keyOf(c,r),l=M[c].get(k);if(!l||(l.u||0)<(r.u||0))M[c].set(k,r)}))});
 COLS.forEach(c=>{S[c]=[...M[c].values()].filter(r=>{const d=S.del[keyOf(c,r)];return!(d&&d.t>=(r.u||0))})})}

async function ensureKey(){if(KEY)return;if(!cfg.salt||!cfg.pass)throw new Error('Not connected');KEY=await deriveKey(cfg.pass,unb64(cfg.salt),cfg.it)}
async function syncOnce(){await ensureKey();const files=await listRemote(),remotes={};
 const changed=Object.keys(files).filter(n=>FILE_RE.test(n)&&files[n]!==cfg.shas[n]);
 for(const n of changed)remotes[n]=await getFile(n);
 if(changed.length){mergeInto(changed.map(n=>remotes[n]));afterMerge();changed.forEach(n=>{cfg.shas[n]=files[n]})}
 const up=new Set(cfg.dirty);changed.forEach(n=>{const k=kname(n);if(vset(buildFile(k))!==vset(remotes[n]))up.add(k)});
 for(const k of up){const name=fname(k),obj=buildFile(k);
  if(isEmpty(obj)&&!files[name]){cfg.dirty=cfg.dirty.filter(x=>x!==k);continue}
  const body={message:'sync',content:b64(TE.encode(await encJ(obj)))};if(cfg.shas[name])body.sha=cfg.shas[name];
  const r=await api('/contents/'+name,{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return true;if(!r.ok)throw await apiErr(r);
  cfg.shas[name]=(await r.json()).content.sha;cfg.dirty=cfg.dirty.filter(x=>x!==k);saveCfg()}
 cfg.dirty=[];return false}
async function sync(){if(!cfg.token)return setSt('off');if(busy){again=true;return}
 busy=true;lastTry=Date.now();setSt('busy');
 try{for(let i=0;i<3;i++){if(!(await syncOnce()))break;if(i===2)throw new Error('Another device is syncing at the same moment. Will retry.')}
  cfg.last=Date.now();cfg.pend=0;saveCfg();setSt('ok')}
 catch(e){const was=ss.s==='err',msg=e.name==='OperationError'?'Wrong passphrase, or the data folder was reset. Disconnect and connect again.':e instanceof TypeError?netMsg():e instanceof SyntaxError?'A file in the data folder is damaged or not from this app':e.message;setSt('err',msg);if(!was)toast('Not synced: '+msg)}
 busy=false;if(again){again=false;schedule(500)}}
